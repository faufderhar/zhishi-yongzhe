name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    # r9：只改截图/文档的提交不重新构建部署（以前 r8b 截图提交 57c2aba 触发了重建，线上 bundle 名和验收时记下的不一样）
    paths-ignore: ['screenshots/**', 'docs/**', 'recordings/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
